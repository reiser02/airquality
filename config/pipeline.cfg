[data]
# Fuente compartida; todas las series se agregan a horario mediante preprocess().
raw_base_dir = data/raw/datos_estaciones_5m
data_root = data/raw/datos_estaciones_5m
key_word = NO2
file_extension = csv
freq = h
timestamp_column = fecha

[anomaly]
# unlabeled: cribado sin etiquetas por tasa de deteccion (igual que produccion).
# synthetic: inyeccion de anomalias sobre la serie real (sin base STL) + VUS-PR.
mode = unlabeled
pollutant = NO2
models = all
device = multi-gpu
seed = 13
# Stride de ventanas de entrenamiento CARLA; 1 conserva el muestreo completo.
carla_stride = 1
# [unlabeled] Binarizacion de scores: umbral = mediana + threshold_k * 1.4826 * MAD.
threshold_k = 3.5
# [unlabeled] En cada serie se descartan los detectores cuya tasa de deteccion
# supere este limite (los errores de sensor son raros).
max_detection_rate = 0.07
# [synthetic] Semilla de la inyeccion de evaluacion (held-out; distinta de seed).
eval_seed = 101
# [synthetic] Tamano del ensemble (top-k por VUS-PR de la inyeccion de seleccion).
ensemble_top_k = 3
# En unlabeled entran segmentos observados de al menos 8 horas. Synthetic aplica
# ademas un suelo interno de 300 puntos para que la inyeccion no domine la serie.
min_series_points = 8

[benchmark]
size_k = 5
gap_sizes = 1,2,5,10
num_gaps = 3
gap_strategy = block
metrics = mae,rmse,mase
random_seed = 42
seasonality_m = 24
val_size = 48
val_context_len = 72
min_train_len_base = 72

[imputation]
# Disponibles: TiDE,NHiTS,NLinear,DLinear,TCN,TSMixer,RNN,
# LinearRegression,Prophet,TSPulse,TSPulse_FineTuned,interp,LinearInterp.
model_names = TiDE,NHiTS,NLinear,DLinear,TCN,TSMixer,RNN,LinearRegression,Prophet,TSPulse,interp,LinearInterp
# true: aborta si falta algun models/{ModelName}_k{size_k}.pt seleccionado.
# false: omite los modelos Darts sin artefacto y continua con los disponibles.
strict_artifacts = true
max_workers = 1

[forecasting]
pollutant = NO2
detectors = all
seed = 13
# multi-gpu: un worker por GPU; con una GPU usa cuda y sin CUDA cae a CPU.
# Tambien admite cuda | cpu.
device = multi-gpu
threshold_k = 3.5
max_detection_rate = 0.07
imputation_model = TSPulse
# Solo se rellenan ventanas NaN completas de hasta este numero de horas.
max_imputation_gap = 5
# Disponibles: catalogo entrenado + AutoARIMA,AutoETS,Chronos2,TimesFM2p5,PatchTSTFM.
# En el test comun los foundation son referencias zero-shot sin variante de train.
forecast_models = TiDE,NHiTS,NLinear,DLinear,TCN,TSMixer,RNN,LinearRegression,AutoARIMA,AutoETS,Chronos2,TimesFM2p5,PatchTSTFM
# Test exacto. Tras detectar sobre la serie completa se usa la racha comun mas
# reciente que ninguna estrategia rompe y que tenga contexto + test.
holdout = 192
context_len = 72
# Rolling short: 11 validaciones sobre 48 h; test actualizado cada 4 h.
short_horizon = 8
short_stride = 4
short_validation_len = 48
# Rolling long: 3 validaciones sobre 96 h; test actualizado cada 24 h.
long_horizon = 48
long_stride = 24
long_validation_len = 96
# Estrategias de deteccion a comparar contra el brazo raw:
#   unlabeled   consenso filtrado por tasa de deteccion (metodo de produccion)
#   inject-best mejor detector por VUS-PR sobre una copia con inyeccion sintetica
#   inject-vote top-k por VUS-PR de inyeccion; anomalia si coinciden min_votes mascaras
strategies = unlabeled,inject-best,inject-vote
# both: cada estrategia con y sin imputacion; impute | none limitan a una variante.
imputation = both
# [inject-*] Semilla de la inyeccion de seleccion (independiente de seed).
injection_seed = 101
# Test pareado foundation: inyecta cada tipo solo en copias del contexto y deja
# intactos los targets. Sus semillas deben diferir de injection_seed.
foundation_preprocessing_test = true
foundation_test_seed = 1001
foundation_test_repeats = 1
# [inject-*] Solo segmentos con al menos estos puntos entran en la seleccion.
min_selection_points = 300
# [inject-vote] Tamano del top-k y votos minimos para marcar anomalia.
vote_top_k = 3
vote_min_votes = 2
# Cache en disco de detecciones y backtests: una ejecucion interrumpida se
# reanuda y cambios de datos/config invalidan solos (clave por contenido).
# Borra el directorio para recalcular desde cero.
use_cache = true
cache_dir = reports/forecasting/cache

[tspulse]
id_column = series_id
tspulse_target_column = value
target_column_index = 0
min_non_nan_ratio = 0.15
min_series_points = 600
model_id = ibm-granite/granite-timeseries-tspulse-r1
revision = tspulse-hybrid-dualhead-512-p8-r1
finetuned_model_path =
context_length = 512
mask_type = var_hybrid
mask_ratio = 0.7
epochs = 100
batch_size = 16
eval_batch_size = 16
valid_fraction = 0.2
learning_rate = 1e-4
weight_decay = 1e-2
plateau_mode = min
plateau_factor = 0.5
plateau_patience = 3
plateau_threshold = 1e-4
plateau_threshold_mode = rel
plateau_cooldown = 0
plateau_min_lr = 1e-6
plateau_eps = 1e-8
early_stopping_patience = 5
early_stopping_threshold = 0.0
num_workers = 4
seed = 42
device = cuda
report_to = none
output_dir = models/tspulse_finetune

[training]
# Modelos Darts que producen artefactos models/{ModelName}_k{size_k}.pt.
model_names = TiDE,NHiTS,NLinear,DLinear,TCN,TSMixer,RNN,LinearRegression
# auto: usa GPU si hay CUDA disponible y CPU si no; tambien admite gpu | cpu.
accelerator = auto
batch_size = 256
n_epochs = 40
learning_rate = 1e-3
weight_decay = 1e-2
lr_scheduler_factor = 0.5
lr_scheduler_patience = 2
random_state = 42
early_stopping_patience = 7
early_stopping_min_delta = 1e-4

[models]
tide_input_chunk_length = 72
tide_hidden_size = 512
nhits_input_chunk_length = 72
nhits_layer_widths = 512
nlinear_input_chunk_length = 72
dlinear_input_chunk_length = 72
tcn_input_chunk_length = 72
tcn_num_filters = 16
tsmixer_input_chunk_length = 72
tsmixer_hidden_size = 128
tsmixer_ff_size = 128
rnn_input_chunk_length = 48
rnn_training_length = 72
rnn_hidden_dim = 64
linear_regression_lags = 72
