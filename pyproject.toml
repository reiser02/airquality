[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "airquality-benchmark"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "darts[torch]>=0.46.1",
    "granite-tsfm>=0.3.4",
    "matplotlib>=3.10.8",
    "numpy>=2.3.5",
    "pandas>=2.3.3",
    "prophet>=1.3.0",
    "requests>=2.32.5",
    "scikit-learn>=1.7.2",
    "scipy>=1.17.1",
    "seaborn>=0.13.2",
    "statsmodels>=0.14.6",
    "statsforecast>=1.4",
    "tabulate>=0.9.0",
    "torch==2.7.1+cu118",
    "urllib3>=2.6.3",
]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "nbconvert>=7.17.1",
    "pytest>=9.0.3",
]

[tool.pytest.ini_options]
# Our suite lives in tests/. The vendored `genias/` project ships its own tests
# and its own env, so keep it out of `uv run pytest` at the repo root.
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
torch = { index = "pytorch-cu118" }

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true
